name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cœur Rust : workspace complet (bureau + crate Android, compilée pour l'hôte
  # par `cargo test`). La cross-compilation Android réelle est faite dans le job
  # `android` via cargo-ndk (elle exige le NDK, absent d'un runner nu).
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap (desktop capture dep)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

  # Application Android : build + tests unitaires JVM.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;29.0.14206865"

      - name: Unit tests (builds Rust .so + UniFFI bindings + app)
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./gradlew :app:assembleDebug --stacktrace
