# Racine d'espace de travail : le paquet `netman` (bureau) reste le membre par
# défaut — `cargo build --release` à la racine ne construit que lui. Le crate
# Android (`android/rust/netman-android`) n'est construit que sur demande.
[workspace]
members = [".", "android/rust/netman-android"]

[package]
name = "netman"
version = "1.0.1"
edition = "2021"
description = "Netman Reborn — Etherman (L2) + Interman (L3) passive network monitor"
license = "MIT"

[dependencies]
etherparse = "0.20.3"
tokio = { version = "1.53.0", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "signal",
    "macros",
] }
serde = { version = "1.0.229", features = ["derive"] }
dns-lookup = "2"
serde_json = "1.0.151"
anyhow = "1"
thiserror = "2"
tracing = "0.1.44"

# Dépendances du bureau uniquement : la bibliothèque compilée pour Android
# (capture via tun, pas de pcap ; deltas via callback, pas de serveur axum)
# ne doit tirer aucune d'elles.
[target.'cfg(not(target_os = "android"))'.dependencies]
pcap = "2.4.0"
clap = { version = "4.6.3", features = ["derive"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["fs"] }
socket2 = "0.6"
futures-util = "0.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_LibraryLoader"] }

[profile.release]
lto = "thin"
